# NASDAQ paper trading botu - örnek yapılandırma
# Tüm değerler CLI bayraklarıyla geçersiz kılınabilir.

# Veri sağlayıcı: "yfinance" (gerçek, internet gerekir) veya "synthetic" (çevrimdışı test)
provider: yfinance

# İzlenecek semboller (NASDAQ hisseleri)
symbols:
  - AAPL
  - MSFT
  - NVDA

# Başlangıç sanal nakit (USD)
cash: 10000

# İşlem başına komisyon (oran, ör. 0.0 = komisyonsuz)
commission: 0.0

# Strateji ayarları
strategy:
  name: sma_crossover   # mevcut: sma_crossover, rsi
  params:
    fast: 20            # hızlı SMA periyodu
    slow: 50            # yavaş SMA periyodu

# Backtest aralığı
backtest:
  period: "2y"          # yfinance period (ör. 6mo, 1y, 2y, max)
  interval: "1d"        # bar aralığı

# Canlı paper-trade döngüsü
live:
  interval: "1d"        # bar aralığı
  poll_seconds: 3600    # her N saniyede bir yeniden değerlendir
